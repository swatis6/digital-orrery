[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "digital-orrery"
version = "0.1.0"
description = "Spacecraft mission analysis: orbit propagation now, interplanetary trajectories and systems models next."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
]

[project.optional-dependencies]
dev = ["pytest>=7", "matplotlib>=3.7"]

[tool.setuptools]
packages = ["orrery"]

[tool.pytest.ini_options]
testpaths = ["tests"]