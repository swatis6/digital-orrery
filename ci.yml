name: CI

on: [push, pull_request]

jobs:
  run-example:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Run the LEO decay example
        env:
          MPLBACKEND: Agg   # draw plots without opening windows
        run: python examples/leo_decay.py
      - name: Run the inclined decay example
        env:
          MPLBACKEND: Agg
        run: python examples/inclined_decay.py